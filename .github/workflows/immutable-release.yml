# SPDX-License-Identifier: MIT OR Apache-2.0
#
# R-003 protocol step 1: enable release immutability in the repository
# settings first, then create a draft, attach the asset, and publish it;
# GitHub issues the release attestation on publication. The artifact
# attestation is optional and lets the same asset be checked in both Strict
# and Attested modes.

name: r003-immutable-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: fixture version (MAJOR.MINOR.PATCH)
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fixture
        run: bash scripts/build-fixture.sh "${{ inputs.version }}" dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Draft, attach, publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" --draft \
            --repo "$GITHUB_REPOSITORY" \
            --title "R-003 immutable v${VERSION}" \
            --notes "R-003 immutable release"
          gh release upload "v${VERSION}" dist/*.deb --repo "$GITHUB_REPOSITORY"
          gh release edit "v${VERSION}" --draft=false --repo "$GITHUB_REPOSITORY"

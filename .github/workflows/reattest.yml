# SPDX-License-Identifier: MIT OR Apache-2.0
#
# R-003 follow-up (2026-10-25, GitHub Community discussion 211055): after the
# transfer, attest the bytes of an existing release asset again from this
# repository, and see whether the repository and organization endpoints
# find the new attestation and what it names.

name: r003-reattest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag whose .deb asset is attested again
        required: true

permissions: {}

jobs:
  reattest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
